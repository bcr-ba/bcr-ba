  <text x="106" y="209" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#5B7487">IOT SENSORS</text>
  <rect x="225" y="162" width="156" height="64" rx="10" fill="#FFFFFF"/>
  <rect x="225.5" y="162.5" width="155" height="63" rx="9.5" stroke="#3D7F94" stroke-opacity="0.4"/>
  <text x="303" y="190" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0F2035">MQTT</text>
  <text x="303" y="209" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#5B7487">EVENT BUS</text>
  <rect x="422" y="162" width="156" height="64" rx="10" fill="#FFFFFF"/>
  <rect x="422" y="162" width="156" height="64" rx="10" fill="#C77A14" fill-opacity="0.10"/>
  <rect x="422.5" y="162.5" width="155" height="63" rx="9.5" stroke="#C77A14" stroke-opacity="0.9"/>
  <text x="500" y="190" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0F2035">LangGraph</text>
  <text x="500" y="209" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#C77A14">7 AGENTS</text>
  <rect x="619" y="162" width="156" height="64" rx="10" fill="#FFFFFF"/>
  <rect x="619.5" y="162.5" width="155" height="63" rx="9.5" stroke="#3D7F94" stroke-opacity="0.4"/>
  <text x="697" y="190" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0F2035">Multimodal LLM</text>
  <text x="697" y="209" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#5B7487">VERIFY FIRST</text>
  <rect x="816" y="162" width="156" height="64" rx="10" fill="#FFFFFF"/>
  <rect x="816.5" y="162.5" width="155" height="63" rx="9.5" stroke="#3D7F94" stroke-opacity="0.4"/>
  <text x="894" y="190" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="700" fill="#0F2035">Pepper</text>
  <text x="894" y="209" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#5B7487">ROBOT ACTION</text>
  <text x="28" y="270" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="11" letter-spacing="1.5" fill="#5B7487">FASTAPI · LANGGRAPH · OLLAMA · MQTT · HOME ASSISTANT · WEBOTS / PEPPER</text>
