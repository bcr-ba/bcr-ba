      <stop offset="0" stop-color="#1E4A63" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0F2035" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="199" rx="18" fill="url(#bg)"/>
