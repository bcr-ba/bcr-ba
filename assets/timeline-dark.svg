<svg viewBox="0 0 1000 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience timeline. 2023 · 2024: BI Intern, Mauritania at Banque Centrale; SUMMER 2024: IoT Developer Intern at Pristini School of AI; JUL – OCT 2025: Generative AI Intern at Novation City; DEC 25 – JAN 26: Applied ML Intern at Ubotica Technologies; 2026 · THESIS 1.3: AI Research Intern at OTH Amberg-Weiden; next: Junior AI / ML Engineer.">
  <style>
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .packet { animation: travel 3.2s linear infinite; }
    @keyframes pulse { 50% { transform: scale(1.25); opacity: .75; } }
    @keyframes travel {
      0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; }
      90% { opacity: 1; } 100% { transform: translateX(400px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .pulse, .packet { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
