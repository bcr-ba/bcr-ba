  <text x="908" y="62" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#C77A14">LATE 2026</text>
  <circle cx="908" cy="96" r="7" fill="#FFFFFF" stroke="#C77A14" stroke-width="2" stroke-dasharray="3 3"/>
