<svg viewBox="0 0 1000 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Experience timeline. 2023 · 2024: BI Intern, Mauritania at Banque Centrale; SUMMER 2024: IoT Developer Intern at Pristini School of AI; JUL – OCT 2025: Generative AI Intern at Novation City; DEC 25 – JAN 26: Applied ML Intern at Ubotica Technologies; MAR 2026 – NOW: AI Research Intern at OTH Amberg-Weiden; next, Junior AI / ML Engineer from late 2026.">
  <style>
    .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
    .packet { animation: travel 3.2s linear infinite; }
    @keyframes pulse { 50% { transform: scale(1.25); opacity: .75; } }
    @keyframes travel {
      0% { transform: translateX(0); opacity: 0; } 10% { opacity: 1; }
      90% { opacity: 1; } 100% { transform: translateX(400px); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) { .pulse, .packet { animation: none; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F3F7FB"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#DCEAF2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F3F7FB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect x="0.5" y="0.5" width="999" height="199" rx="18" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="999" height="199" rx="18" fill="url(#halo)"/>
  <rect x="0.5" y="0.5" width="999" height="199" rx="18" fill="none" stroke="#0F2035" stroke-opacity="0.12"/>
  <defs>
    <linearGradient id="tl" x1="92" y1="0" x2="745" y2="0" gradientUnits="userSpaceOnUse">
