  <text x="418" y="159" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12.5" fill="#2F5E73">Generative AI Intern</text>
  <text x="582" y="62" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#5B7487">DEC 25 – JAN 26</text>
