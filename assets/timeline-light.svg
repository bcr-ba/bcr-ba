  <line x1="745" y1="96" x2="908" y2="96" stroke="#C77A14" stroke-opacity="0.6" stroke-width="2" stroke-dasharray="2 6" stroke-linecap="round"/>
  <text x="92" y="62" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#5B7487">2023 · 2024</text>
  <circle cx="92" cy="96" r="6.5" fill="#FFFFFF" stroke="#3D7F94" stroke-width="2"/>
