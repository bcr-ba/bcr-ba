  <text x="255" y="62" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#5B7487">SUMMER 2024</text>
  <circle cx="255" cy="96" r="6.5" fill="#FFFFFF" stroke="#3D7F94" stroke-width="2"/>
