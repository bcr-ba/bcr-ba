  <text x="745" y="62" text-anchor="middle" font-family="ui-monospace, 'SF Mono', 'Cascadia Code', 'JetBrains Mono', Consolas, monospace" font-size="10.5" letter-spacing="1.5" fill="#C77A14">MAR 2026 – NOW</text>
