<svg viewBox="0 0 1000 300" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bocar Ba — Junior AI Engineer, LLM Agents, Applied ML">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0A1729"/>
      <stop offset="1" stop-color="#0F2035"/>
    </linearGradient>
    <linearGradient id="wire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#74B4C7" stop-opacity="0.15"/>
      <stop offset="0.5" stop-color="#74B4C7" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F2AC4E" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.4" r="0.55">
      <stop offset="0" stop-color="#1E4A63" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#0F2035" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="998" height="298" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="998" height="298" rx="18" fill="url(#halo)"/>
  <rect x="1.5" y="1.5" width="997" height="297" rx="17.5" fill="none" stroke="#74B4C7" stroke-opacity="0.18"/>

  <text x="500" y="120" text-anchor="middle"
        font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif"
        font-size="66" font-weight="700" letter-spacing="10" fill="#EDF3F9">BOCAR BA</text>

  <rect x="452" y="140" width="96" height="3" rx="1.5" fill="#F2AC4E"/>

  <text x="500" y="180" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace"
        font-size="18" letter-spacing="4" fill="#89B7C6">JUNIOR AI ENGINEER  ·  LLM AGENTS  ·  APPLIED ML</text>

  <g>
    <line x1="300" y1="232" x2="700" y2="232" stroke="url(#wire)" stroke-width="2"/>
    <circle cx="300" cy="232" r="7" fill="#0A1729" stroke="#74B4C7" stroke-width="2"/>
    <circle cx="367" cy="232" r="7" fill="#0A1729" stroke="#74B4C7" stroke-width="2"/>
    <circle cx="433" cy="232" r="7" fill="#0A1729" stroke="#74B4C7" stroke-width="2"/>
    <circle cx="500" cy="232" r="8.5" fill="#F2AC4E" filter="url(#glow)">
      <animate attributeName="r" values="8.5;10.5;8.5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="fill-opacity" values="1;0.75;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="567" cy="232" r="7" fill="#0A1729" stroke="#74B4C7" stroke-width="2"/>
    <circle cx="633" cy="232" r="7" fill="#0A1729" stroke="#74B4C7" stroke-width="2"/>
    <circle cx="700" cy="232" r="7" fill="#0A1729" stroke="#74B4C7" stroke-width="2"/>
    <circle cx="300" cy="232" r="3.5" fill="#F2AC4E">
      <animate attributeName="cx" values="300;700" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.1;0.9;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="500" y="270" text-anchor="middle"
        font-family="ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace"
        font-size="12.5" letter-spacing="3" fill="#6E8AA0">MULTI-AGENT SYSTEMS  ·  LOCAL INFERENCE</text>
</svg>
